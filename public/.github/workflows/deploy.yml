name: Build and Deploy Portfolio
on:
  push:
    branches: [main] # Change this to master if your primary branch is master
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install and Build Workspace
        run: |
          npm install
          npm run build
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist' # Lovable/Vite builds project files to the dist directory
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
